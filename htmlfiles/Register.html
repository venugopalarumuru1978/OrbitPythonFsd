<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Register Page</title>    
</head>
<body bgcolor="#BEC227">
    <img src="Pic2.jpg"  width="100%" height="150px" alt="None" />
    <hr />
    <p style="text-align: center;">
        <a href="LoginPage.html">Login</a> &nbsp;&nbsp;&nbsp;
        <a href="Register.html">Register</a>&nbsp;&nbsp;&nbsp;
        <a href="Contact.html">Contact</a>
    </p>
<hr />
    <table width="100%" border="0">

            <tr>

                <td colspan="3">

                    <h3 style="text-align: center;">Register Here</h3>
                </td>

            </tr>
        
            <tr>
                <td width="25%"></td>
                <td width="50%">

                    <p style="text-align: center;">
                        <label>Person Name</label> <br />
                        <input type="text" name="txtPname" placeholder="enter ur name" />

                        <br /><br />
                        <label>Gender</label> <br />
                <input type="radio"  name="rdoGender"   value="Male" />
                <label>Male</label> &nbsp;&nbsp;&nbsp;
                <input type="radio"  name="rdoGender"   value="Female" />
                <label>Female</label> 
                <br /><br />
<label>Hobbies</label> <br />
              <input type="checkbox"  name="chkHob1"  value="Gardening" />
              <label>Gardening</label>&nbsp;&nbsp;&nbsp;
              <input type="checkbox"  name="chkHob2"  value="Chess" />
              <label>Playing Chess</label><br />
              <input type="checkbox"  name="chkHob3"  value="Reading" />
              <label>Reading Books</label>&nbsp;&nbsp;&nbsp;
              <br /><br />
              <label>Age</label>  
              <input type="number" name="txtAge"  min="16" max="25" />
              
              <br /><br />
              <label>Date of Joining Course</label>  <br />
              <input type="date" name="txtJoin"   />
              <br /><br />
                <label>Address</label> <br />
                <textarea  name="txtAdrs"  rows="5"  cols="50" placeholder="enter ur address">

                </textarea>
                <br /><br />

                        <label>Location</label>
                        <br />
                        <select name="ddlLoc">
                            <option value="Hyd">Hyderabad</option>
                            <option value="Sec">Secundrabad</option>
                            <option value="Vzg">Vizag</option>
                            <option value="Del">Delhi</option>
                            <option value="Amr">Amaravathi</option>
                        </select>
                        <br /><br />
                      <label>Email</label>  
              <input type="email" name="txtEmail"  placeholder="demo@gmail.com" />
               <br /><br />
                      <label>Phone Number</label>  
              <input type="tel" name="txtph"  placeholder="Phone Number 10 digits" />
                            
              
              <br /><br />

                        <input type="button"  value="Click Me" />
                        &nbsp;&nbsp;
                        <input type="reset"  value="Clear Form" />
                    </p>

                </td>
                <td width="25%"></td>
            </tr>
    </table>
</body>
</html>
