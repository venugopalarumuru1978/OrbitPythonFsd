<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    
</head>
<body>
    <h1 style="text-align: center;">TextBox Demo</h1>
    <hr />
    <form name="frmTest" >
    <p style="text-align: center;">
        <label>Ur Name</label>
        <input type="text"  name="txtName" placeholder="Enter ur name" />
        <input type="button"  value="Click Me" onclick="testFun()" />
    </p>
    </form>

    <p style="text-align: center;"  id="resInfo">Result</p>

    <script  type="text/javascript">
        function testFun()
        {
            var sname = frmTest.txtName.value;

            if(sname!="")
                document.getElementById("resInfo").innerHTML = "Hello " + sname;
            else
                alert("Please enter ur name ");            
        }

    </script>
</body>
</html>
