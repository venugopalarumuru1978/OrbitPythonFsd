<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-warning">
    
    <nav class="navbar navbar-expand-lg bg-info">
      <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img src="pic1.jpg" width="25"  height="25" />
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarex" aria-controls="navbarex" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
      </div>

        <div class="collapse navbar-collapse" id="navbarex">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="LoginBoot.html">Login</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="RegBoot.html">Register</a>
          </li>

        </ul>
        
        </div>
    </nav>    

<br />

    <div class="container-fluid">
        <div class="row">
          <div class="col-lg-2"></div>
          <div class="col-lg-8">
              <div class="card">
                <div class="card-header bg-info" ><b>Register Here</b></div>
                <div class="card-body">
                  <div class="row">
                    <div class="col-lg-4">
                      <label>Emp ID</label>
                      <input type="text"  name="txtEid" class="form-control"/>
                    </div>

                    <div class="col-lg-4">
                      <label>Emp Name</label>
                      <input type="text"  name="txtEname" class="form-control"/>
                    </div>
                     <div class="col-lg-4">
                      <label>Job</label>
                      <select name="ddlLoc" class="form-select">
                        <option value="-1">Job</option>
                        <option value="Manager">Manager</option>
                        <option value="Developer">Developer</option>
                      </select>
                    </div>

                  </div>

                  <div class="row">
                    <div class="col-lg-4">
                        <label>Gender</label> <br />
                        <input type="radio"  name="rdoGender"  value="Male" />
                        <label>Male</label>
                        &nbsp;&nbsp;&nbsp;&nbsp;
                        <input type="radio"  name="rdoGender"  value="Female" />
                        <label>Female</label>
                    </div>
                    <div class="col-lg-8">
                        <label>Hobbies</label><br />
                        <input type="checkbox"  name="chk1"  value="Read" />
                        <label>Reading Books</label>
                        &nbsp;&nbsp;&nbsp;&nbsp;
                        <input type="checkbox"  name="chk2"  value="chess" />
                        <label>Playing Chess</label>
                        &nbsp;&nbsp;&nbsp;&nbsp;
                        <input type="checkbox"  name="chk3"  value="garden" />
                        <label>Gardening</label>

                    </div>
                  </div>

                  <div class="row">
                    <div class="col-lg-12">
                      <label>Address</label>
                      <textarea name="txtAdrs"  class="form-control"></textarea>
                    </div>
                  </div>

                  <div class="row">

                    <div class="col-lg-4">
                        <label>Location</label>
                        <select name="ddlLoc"  class="form-select">
                          <option value="-1">Location</option>
                          <option  value="Hyd">Hyderabad</option>
                          <option  value="Sec">Secundrabad</option>
                          <option  value="Amr">Amaravathi</option>
                        </select>
                    </div>
                    <div class="col-lg-4">
                      <label>Email</label>
                      <input type="email" name="txtEmail"  class="form-control" />
                    </div>
                    <div class="col-lg-4">
                      <label>Phone</label>
                      <input type="text" name="txtph"  class="form-control" />
                    </div>

                  </div>
<br />
                  <div class="row">

                    <div class="col-lg-12"  style="text-align: center;">

                      <input type="button"  value="Register"  class="btn btn-success" />
                        &nbsp;&nbsp;&nbsp;&nbsp;
                      <input type="button"  value="Reset"  class="btn btn-danger" />

                    </div>

                  </div>
                </div>
              </div>

          </div>
          <div class="col-lg-2" ></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
