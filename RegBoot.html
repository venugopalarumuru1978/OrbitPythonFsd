<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body style="margin-top: 100px;" class="bg-warning">
    
    <div class="container-fluid">
        <div class="row">
          <div class="col-lg-2"></div>
          <div class="col-lg-8">
              <div class="card">
                <div class="card-header bg-info" ><b>Register Here</b></div>
                <div class="card-body">
                  <div class="row">
                    <div class="col-lg-4">
                      <label>Emp ID</label>
                      <input type="text"  name="txtEid" class="form-control"/>
                    </div>

                    <div class="col-lg-4">
                      <label>Emp Name</label>
                      <input type="text"  name="txtEname" class="form-control"/>
                    </div>

                     <div class="col-lg-4">
                      <label>Job</label>
                      <select name="ddlLoc" class="form-select">
                        <option value="-1">Job</option>
                        <option value="Manager">Manager</option>
                        <option value="Developer">Developer</option>

                      </select>
                    </div>

                  </div>
                </div>
              </div>

          </div>
          <div class="col-lg-2" ></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
