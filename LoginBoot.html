<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body style="margin-top: 100px;" class="bg-warning">
    
    <div class="container-fluid">
        <div class="row">
          <div class="col-lg-3"  ></div>
          <div class="col-lg-6">






              <div class="card">
                <div class="card-header bg-info" ><b>Login Here</b></div>
                <div class="card-body">
                              <label>Username</label>
            <input type="text" name="txtUser" placeholder="Username" class="form-control" />

            <br />
            <label>Password</label>
            <input type="password" name="txtPass" placeholder="Password"  class="form-control" />

            <br />

            <input type="button"  value="Click Me" class="btn btn-primary"/>
            &nbsp;&nbsp;&nbsp;
            <input type="button"  value="Reset" class="btn btn-danger"/>

                </div>
              </div>

          </div>
          <div class="col-lg-3" ></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
