            <div class="card">
                <div class="card-header">Calculations</div>
                <div class="card-body">
                    <form name="frmCal">
                        <label>Value-1</label>
                        <input type="text" name="txtVal1"  
                        class="form-control" placeholder="Value-1" />
                        <br />

                        <label>Value-2</label>
                        <input type="text" name="txtVal2"  
                        class="form-control" placeholder="Value-2" />
                        <br />

                        <input type="button"  value="Click Me"  
                        class="btn btn-primary" onclick="calfun()" />
                        &nbsp;&nbsp;&nbsp;
                        <input type="reset"  value="Clear Form"  
                        class="btn btn-warning" onclick="clearinfo()" />
                    </form>
                    <br />

    <script type="text/javascript">
        function calfun()
        {
            let x = parseFloat(frmCal.txtVal1.value);
            let y = parseFloat(frmCal.txtVal2.value);

            let sum = x+y;
            let sub = x-y;
            let mul = x*y;
            let div = x/y;

            let result = "Add = " + sum + "<br />Minus = " + sub;
result += "<br />Multiplication = " + mul + "<br />Division = " + div;

            document.getElementById("resinfo").innerHTML = result;
        }

        function clearinfo()
        {
            document.getElementById("resinfo").innerHTML = "";
        }
    </script>
